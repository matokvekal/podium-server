name: Deploy Server to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.ELNINO_GITHUB_DEPLOY }}
          script: |
            sudo mkdir -p /opt/elnino
            sudo chown -R $USER:$USER /opt/elnino

      - name: Deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.ELNINO_GITHUB_DEPLOY }}
          source: "dist,package.json,package-lock.json"
          target: "/opt/elnino"
          overwrite: true

      - name: Install production deps and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.ELNINO_GITHUB_DEPLOY }}
          script: |
            set -e
            cd /opt/elnino
            npm ci --omit=dev
            # The app runs under PM2, owned by the `elnino` user's own PM2 daemon
            # (process: elnino-server). There is a SEPARATE root PM2 daemon running
            # `commissaire-api` on this host — it must never be touched here. Restart
            # against the elnino daemon whether GitHub connects as elnino or as root.
            if [ "$(id -un)" = "elnino" ]; then
              pm2 restart elnino-server --update-env
              pm2 save
            else
              sudo -u elnino -H pm2 restart elnino-server --update-env
              sudo -u elnino -H pm2 save
            fi