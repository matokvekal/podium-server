name: Ops - BRouter and deployment backup

# Run by hand only (Actions tab, or: gh workflow run ops-brouter.yml -f action=status).
# Same host, user and key as deploy-prod.yml. Touches only what each action says; never the
# database, nginx, the video worker, or the root pm2 daemon (commissaire-api).
#
#   status            read-only: BRouter preflight + elnino pm2 list + whether ROUTING_URL is set
#   backup            tar of /opt/elnino (dist, .env, package*.json) + /var/www/elnino → /opt/elnino-backups
#   install           scripts/brouter/install-brouter.sh (runs the preflight; stops on NO-GO)
#   check             scripts/brouter/check-brouter.sh (Road + Off-road routing test)
#   set-routing-url   ROUTING_URL=http://127.0.0.1:17777 in /opt/elnino/.env (.env backed up), restart API
#   unset-routing-url remove ROUTING_URL from /opt/elnino/.env (.env backed up), restart API
#   uninstall         scripts/brouter/uninstall-brouter.sh (rollback of install)
#   restore           put back a backup made by "backup" (input: backup file name), restart API

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options: [status, backup, install, check, set-routing-url, unset-routing-url, uninstall, restore]
      backup:
        description: "restore only: backup file name, e.g. elnino-20261019-120000.tgz"
        required: false
        default: ""

concurrency:
  group: prod-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload BRouter scripts
        if: contains(fromJSON('["status","install","check","uninstall"]'), inputs.action)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.ELNINO_GITHUB_DEPLOY }}
          source: "scripts/brouter/*.sh"
          target: "/tmp/elnino-brouter-ops"
          strip_components: 2
          overwrite: true

      - name: Run ${{ inputs.action }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACTION: ${{ inputs.action }}
          BACKUP: ${{ inputs.backup }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.ELNINO_GITHUB_DEPLOY }}
          envs: ACTION,BACKUP
          command_timeout: 20m
          script: |
            set -euo pipefail
            S=/tmp/elnino-brouter-ops
            ENVF=/opt/elnino/.env
            BK=/opt/elnino-backups
            URL=http://127.0.0.1:17777
            restart_api() {
              sudo -u elnino -H pm2 restart elnino-server --update-env
              sudo -u elnino -H pm2 save
              sleep 4
              echo "API: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6500/api/v1/routes) (401 = up)"
            }
            backup_env() { sudo cp -p "$ENVF" "$ENVF.bak-$(date +%Y%m%d-%H%M%S)"; }
            echo "host $(hostname) · user $(id -un) · action $ACTION"
            case "$ACTION" in
              status)
                sudo bash "$S/preflight-brouter.sh" || true
                echo "--- elnino pm2"; sudo -u elnino -H pm2 ls
                echo "--- ROUTING_URL in .env: $(sudo grep -c '^ROUTING_URL=' "$ENVF" || true)"
                echo "--- deployed: dist $(stat -c %y /opt/elnino/dist 2>/dev/null) · client $(ls /var/www/elnino/assets 2>/dev/null | grep -m1 '^index-.*\.js$')"
                sudo ls -la "$BK" 2>/dev/null || echo "no backups yet"
                ;;
              backup)
                sudo mkdir -p "$BK"
                F="$BK/elnino-$(date +%Y%m%d-%H%M%S).tgz"
                sudo tar -czf "$F" -C / opt/elnino/dist opt/elnino/.env opt/elnino/package.json opt/elnino/package-lock.json var/www/elnino
                sudo ls -la "$F"; echo "BACKUP=$(basename "$F")"
                ;;
              install)   sudo bash "$S/install-brouter.sh" ;;
              check)     bash "$S/check-brouter.sh" ;;
              uninstall) sudo bash "$S/uninstall-brouter.sh" ;;
              set-routing-url)
                backup_env
                sudo sed -i '/^ROUTING_URL=/d' "$ENVF"
                echo "ROUTING_URL=$URL" | sudo tee -a "$ENVF" >/dev/null
                sudo grep '^ROUTING_URL=' "$ENVF"
                restart_api
                ;;
              unset-routing-url)
                backup_env
                sudo sed -i '/^ROUTING_URL=/d' "$ENVF"
                restart_api
                ;;
              restore)
                [ -n "$BACKUP" ] && [ -f "$BK/$BACKUP" ] || { echo "backup '$BACKUP' not found in $BK"; sudo ls "$BK"; exit 1; }
                sudo tar -xzf "$BK/$BACKUP" -C /
                cd /opt/elnino && npm ci --omit=dev
                restart_api
                ;;
            esac
