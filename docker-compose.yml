# Local Podium database. Same file works on Windows (Docker Desktop) and Linux.
#
#   docker compose up -d db        start it (first run builds the image and applies sql/)
#   docker compose logs -f db      watch the schema being created
#   docker compose down            stop, keep the data
#   docker compose down -v         stop and DELETE the data, so the next up re-runs sql/
#
# Only the server itself is not in here — run it with `npm run dev` as usual.

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: podium-postgres:17
    container_name: podium-db
    restart: unless-stopped
    ports:
      # host:container — change the HOST side to 5433 if something already listens on 5432,
      # and change DATABASE_URL in .env to match.
      - "5432:5432"
    environment:
      POSTGRES_USER: podium
      POSTGRES_PASSWORD: podium
      POSTGRES_DB: podium
      TZ: UTC
      PGTZ: UTC
    volumes:
      - podium-db-data:/var/lib/postgresql/data
    healthcheck:
      # The schema scripts run before Postgres accepts outside connections, so "healthy"
      # here means the tables exist too.
      test: ["CMD-SHELL", "pg_isready -U podium -d podium"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  podium-db-data:
